<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Active Members</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- DataTables CSS -->
    <link rel="stylesheet"
          href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">

    <style>
        body {
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 class="mb-4">Active Members</h2>

        <table id="membersTable" class="display table table-striped" style="width:100%">
            <thead>
                <tr>
                    <th>Member ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Membership Type</th>
                    <th>Home Club</th>
                    <th>Join Date</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

    <script>
        $(document).ready(function () {

            $('#membersTable').DataTable({
                ajax: {
                    url: 'https://localhost:5042/api/Members/active',
                    dataSrc: ''
                },
                columns: [
                    { data: 'memberId' },
                    { data: 'firstName' },
                    { data: 'lastName' },
                    { data: 'email' },
                    { data: 'membershipType' },
                    { data: 'homeClub' },
                    {
                        data: 'joinDate',
                        render: function (data) {
                            return new Date(data).toLocaleDateString();
                        }
                    }
                ],
                pageLength: 10,
                responsive: true
            });

        });
    </script>

</body>
</html>
